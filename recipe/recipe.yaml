schema_version: 1

context:
  name: sqlorm-py
  version: "0.4.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sqlorm_py-${{ version }}.tar.gz
  sha256: 5dc8d2051d6b576d8aceaeac3078e2c8b00fcdd6e2ae1b46662df82dc1b5e0b0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.8.11,<0.9.0
    - pip
  run:
    - python >=${{ python_min }}
    - blinker >=1.9.0

tests:
  - python:
      imports:
        - sqlorm
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/hyperflask/sqlorm
  summary: A new kind of ORM that do not abstract away your database or SQL queries.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
